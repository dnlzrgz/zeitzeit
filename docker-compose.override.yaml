services:
  backend:
    user: "1000:1000"
    volumes:
      - ./backend:/app
      - /app/.venv

  db:
    ports:
      - "5432:5432"

  adminer:
    image: adminer
    ports:
      - "8080:8080"
    environment:
      - ADMINER_DESIGN=pepa-linha-dark
    depends_on:
      - db
    restart: unless-stopped
