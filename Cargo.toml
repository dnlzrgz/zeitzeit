[package]
name = "zeitzeit"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"

[dependencies]
anyhow = "1.0.104"
argon2 = "0.6.0"
axum = { version = "0.8.9", features = ["macros", "tracing"] }
base64 = "0.23.1"
chrono = { version = "0.4.45", features = ["serde"] }
chrono-tz = "0.10.4"
config = { version = "0.15.27", default-features = false }
dotenvy = "0.15.7"
garde = { version = "0.23.0", features = ["derive", "email"] }
getrandom = "0.4.3"
log = "0.4.35"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
sqlx = {
  version = "0.9.0",
  default-features = false,
  features = [
    "chrono",
    "macros",
    "migrate",
    "postgres",
    "runtime-tokio",
    "tls-rustls",
    "uuid",
  ]
}
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["macros", "net", "rt-multi-thread", "signal"] }
tower_governor = { version = "0.8.0", default-features = false, features = ["axum"] }
tower-http = {
  version = "0.7.1",
  features = [
    "catch-panic",
    "compression-gzip",
    "cors",
    "limit",
    "request-id",
    "set-header",
    "timeout",
    "trace",
  ]
}
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
utoipa = "6.0.0"
utoipa-axum = "0.3.0"
uuid = { version = "1.29.0", features = ["serde", "v7"] }

[dev-dependencies]
http-body-util = "0.1.5"
tower = { version = "0.5.3", features = ["util"] }

[profile.dev.package.argon2]
opt-level = 3

[profile.release]
strip = "debuginfo"
lto = "thin"
codegen-units = 1
