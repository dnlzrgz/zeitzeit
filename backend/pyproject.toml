[project]
name = "backend"
version = "0.1.0"
description = "self-hosted time tracker backend."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
  "alembic>=1.18.4",
  "fastapi[standard]>=0.136.1",
  "psycopg[binary,pool]>=3.3.4",
  "pwdlib[argon2]>=0.3.0",
  "pydantic-extra-types>=2.11.1",
  "pydantic-settings>=2.14.1",
  "pydantic[email,timezone]>=2.13.4",
  "pyjwt>=2.13.0",
  "sentry-sdk[fastapi]>=2.61.1",
  "sqlalchemy>=2.0.49",
  "sqlmodel>=0.0.38",
  "structlog>=26.1.0",
  "uuid-utils>=0.16.0",
  "uvicorn>=0.48.0",
]

[dependency-groups]
dev = [
  "commitizen>=4.16.2",
  "faker>=40.19.1",
  "httpx2>=2.2.0",
  "prek>=0.4.1",
  "pytest>=9.0.3",
  "pytest-cov>=7.1.0",
  "pytest-randomly>=4.1.0",
  "pytest-xdist[psutil]>=3.8.0",
  "ruff>=0.15.14",
]

[tool.coverage.run]
source = ["app"]
omit = ["app/alembic/*", "app/initial_data.py", "*/__init__.py"]


[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 80
