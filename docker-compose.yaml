services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DB_BACKEND: postgres
      POSTGRES_SERVER: db
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-zeitzeit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zeitzeit}
      POSTGRES_DB: ${POSTGRES_DB:-zeitzeit}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:18.4-alpine3.23
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-zeitzeit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zeitzeit}
      POSTGRES_DB: ${POSTGRES_DB:-zeitzeit}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-zeitzeit} -d ${POSTGRES_DB:-zeitzeit}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

volumes:
  postgres_data:
