services:
  db:
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: zeitzeit:latest
    restart: unless-stopped
    ports:
      - "${API_PORT:-8080}:8080"
    stop_grace_period: 30s
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: wget -q -O /dev/null http://127.0.0.1:8080/readyz
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 15s
