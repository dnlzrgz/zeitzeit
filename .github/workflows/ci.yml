name: CI

on:
  push:
    branches: [master]
  pull_request:

# Only builds and tests so nothing here needs write access.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  DATABASE_URL: postgres://postgres:postgres@localhost:55432/zeitzeit

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      db:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: zeitzeit
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d zeitzeit"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      # Fail on a stale Cargo.lock
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
